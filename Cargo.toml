[package]
name = "cargo-explore"
version = "0.1.0"
edition = "2021"
description = "Interactive TUI for discovering, inspecting and running the binaries and examples of a Cargo project"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-explore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
